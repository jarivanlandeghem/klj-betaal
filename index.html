<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Betaalverzoek</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #000000; --secondary: #6c6c70;
    --separator: rgba(60, 60, 67, 0.18); --accent: #b3261e; --ok: #248a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --text: #ffffff; --secondary: #98989f;
      --separator: rgba(84, 84, 88, 0.6); --accent: #ff6961; --ok: #30d158;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  .hero { text-align: center; margin: 8px 0 24px; }
  .hero p { margin: 0; color: var(--secondary); font-size: 15px; }
  .amount { font-size: 44px; font-weight: 700; letter-spacing: -0.5px; margin: 4px 0; font-variant-numeric: tabular-nums; }
  h2 { font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--secondary); margin: 24px 16px 6px; }
  .section { background: var(--card); border-radius: 22px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; }
  .row + .row { border-top: 0.5px solid var(--separator); margin-left: 16px; padding-left: 0; }
  .row .label { color: var(--secondary); font-size: 13px; }
  .row .value { font-size: 17px; word-break: break-word; }
  .row .grow { flex: 1; min-width: 0; }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: 0.3px; }
  button {
    font: inherit; font-size: 15px; color: var(--accent); background: none; border: 0;
    padding: 6px 4px; cursor: pointer; white-space: nowrap;
  }
  button.copied { color: var(--ok); }
  .all { width: 100%; padding: 14px 16px; text-align: center; font-size: 17px; }
  .qr { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 16px; }
  .qr .code { background: #fff; padding: 12px; border-radius: 16px; line-height: 0; }
  .qr .code img, .qr .code svg { width: 220px; height: 220px; image-rendering: pixelated; }
  .primary {
    width: 100%; padding: 15px 16px; font-size: 17px; font-weight: 600; color: #fff;
    background: var(--accent); border-radius: 14px; text-align: center;
  }
  .primary:active { opacity: 0.8; }
  .steps { margin: 8px 16px 0; padding-left: 18px; color: var(--secondary); font-size: 13px; }
  .steps li + li { margin-top: 2px; }
  .footer { color: var(--secondary); font-size: 13px; margin: 8px 16px 0; }
  .error { text-align: center; color: var(--secondary); margin-top: 30vh; }
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// Alles staat in het stuk na "#": dat stuurt een browser nooit naar de server.
// i = IBAN, n = begunstigde, a = bedrag ("12.50"), m = mededeling.
(function () {
  "use strict";
  var app = document.getElementById("app");
  var params = new URLSearchParams(location.hash.replace(/^#/, ""));
  var iban = (params.get("i") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  var name = (params.get("n") || "").slice(0, 70);
  var amount = parseFloat(params.get("a") || "");
  var remittance = (params.get("m") || "").slice(0, 140);

  function validIBAN(value) {
    if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{8,30}$/.test(value)) return false;
    var moved = value.slice(4) + value.slice(0, 4);
    var digits = moved.replace(/[A-Z]/g, function (c) { return String(c.charCodeAt(0) - 55); });
    var rest = 0;
    for (var k = 0; k < digits.length; k += 7) {
      rest = parseInt(String(rest) + digits.slice(k, k + 7), 10) % 97;
    }
    return rest === 1;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  if (!validIBAN(iban) || !(amount > 0)) {
    app.appendChild(el("p", "error", "Deze betaallink is onvolledig. Vraag een nieuwe aan."));
    return;
  }

  var prettyIBAN = iban.replace(/(.{4})/g, "$1 ").trim();
  var euro = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR" }).format(amount);
  var plainAmount = amount.toFixed(2).replace(".", ",");

  var hero = el("div", "hero");
  hero.appendChild(el("p", null, "Betaalverzoek"));
  hero.appendChild(el("div", "amount", euro));
  if (name) hero.appendChild(el("p", null, "aan " + name));
  app.appendChild(hero);

  function copy(text, button) {
    var done = function () {
      var old = button.textContent;
      button.textContent = "Gekopieerd";
      button.classList.add("copied");
      setTimeout(function () { button.textContent = old; button.classList.remove("copied"); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
    } else { fallback(text); done(); }
  }
  function fallback(text) {
    var area = document.createElement("textarea");
    area.value = text; area.setAttribute("readonly", "");
    area.style.position = "fixed"; area.style.opacity = "0";
    document.body.appendChild(area); area.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(area);
  }

  function row(label, value, copyValue, mono) {
    var r = el("div", "row");
    var grow = el("div", "grow");
    grow.appendChild(el("div", "label", label));
    grow.appendChild(el("div", "value" + (mono ? " mono" : ""), value));
    r.appendChild(grow);
    var b = el("button", null, "Kopieer");
    b.type = "button";
    b.setAttribute("aria-label", label + " kopiëren");
    b.addEventListener("click", function () { copy(copyValue, b); });
    r.appendChild(b);
    return r;
  }

  // De betaal-QR (EPC069-12) — de bankapps lezen die; de gewone camera niet.
  var payload = ["BCD", "002", "1", "SCT", "", name, iban, "EUR" + amount.toFixed(2), "", "", remittance].join("\n");
  function makeQR() {
    if (typeof qrcode !== "function") return null;
    var qr = qrcode(0, "M");
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    qr.addData(payload, "Byte");
    qr.make();
    return qr;
  }
  var qr = makeQR();

  // Een "factuur" als afbeelding: de betaal-QR met de gegevens eronder. Die deel je naar je
  // bankapp (KBC Mobile: Delen ▸ KBC Mobile), die leest de QR en zet de overschrijving klaar.
  function invoiceBlob(callback) {
    var count = qr.getModuleCount(), cell = 12, quiet = 4 * cell;
    var size = count * cell + 2 * quiet, width = size + 160;
    var canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = size + 380;
    var c = canvas.getContext("2d");
    c.fillStyle = "#ffffff"; c.fillRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = "#000000";
    c.font = "600 34px -apple-system, Helvetica, Arial, sans-serif";
    c.textAlign = "center";
    c.fillText("Betaalverzoek" + (name ? " – " + name : ""), width / 2, 56);
    var left = (width - size) / 2 + quiet, top = 90 + quiet;
    for (var r = 0; r < count; r++) {
      for (var k = 0; k < count; k++) {
        if (qr.isDark(r, k)) c.fillRect(left + k * cell, top + r * cell, cell, cell);
      }
    }
    c.textAlign = "left";
    var y = 90 + size + 40, x = 60;
    [["Bedrag", euro], ["Rekening", prettyIBAN], ["Begunstigde", name], ["Mededeling", remittance]]
      .forEach(function (line) {
        if (!line[1]) return;
        c.font = "400 24px -apple-system, Helvetica, Arial, sans-serif";
        c.fillStyle = "#6c6c70"; c.fillText(line[0], x, y);
        c.font = "600 30px -apple-system, Helvetica, Arial, sans-serif";
        c.fillStyle = "#000000"; c.fillText(line[1].slice(0, 46), x, y + 34);
        y += 76;
      });
    canvas.toBlob(callback, "image/png");
  }

  if (qr) {
    var pay = el("button", "primary", "Betaal in je bankapp");
    pay.type = "button";
    pay.addEventListener("click", function () {
      invoiceBlob(function (blob) {
        var file = new File([blob], "betaalverzoek.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "Betaalverzoek" }).catch(function () {});
        } else {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = "betaalverzoek.png";
          document.body.appendChild(a); a.click(); a.remove();
        }
      });
    });
    app.appendChild(pay);
    var steps = el("ol", "steps");
    ["Tik hierboven en kies je bankapp in het deelmenu (bv. KBC Mobile).",
     "Je bankapp leest de betaalcode: rekening, bedrag en mededeling staan klaar.",
     "Staat je bank er niet bij? Bewaar de afbeelding en kies ze in de scanner van je bankapp, of kopieer de gegevens hieronder."]
      .forEach(function (t) { steps.appendChild(el("li", null, t)); });
    app.appendChild(steps);
  }

  app.appendChild(el("h2", null, "Overschrijving"));
  var details = el("div", "section");
  details.appendChild(row("Rekening", prettyIBAN, iban, true));
  if (name) details.appendChild(row("Begunstigde", name, name));
  details.appendChild(row("Bedrag", euro, plainAmount, true));
  if (remittance) details.appendChild(row("Mededeling", remittance, remittance));
  app.appendChild(details);

  var allSection = el("div", "section");
  allSection.style.marginTop = "12px";
  var all = el("button", "all", "Kopieer alle gegevens");
  all.type = "button";
  all.addEventListener("click", function () {
    var lines = ["Rekening: " + prettyIBAN];
    if (name) lines.push("Begunstigde: " + name);
    lines.push("Bedrag: " + euro);
    if (remittance) lines.push("Mededeling: " + remittance);
    copy(lines.join("\n"), all);
  });
  allSection.appendChild(all);
  app.appendChild(allSection);
  app.appendChild(el("p", "footer",
    "Open je bankapp, kies een nieuwe overschrijving en plak de gegevens. Controleer altijd de begunstigde."));

  // Dezelfde betaal-QR op het scherm: handig als je deze pagina op een computer opent en
  // met de scanner van je bankapp op je gsm scant.
  if (qr) {
    app.appendChild(el("h2", null, "Op een computer? Scan met je bankapp"));
    var qrSection = el("div", "section qr");
    var holder = el("div", "code");
    holder.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
    holder.firstChild.setAttribute("role", "img");
    holder.firstChild.setAttribute("aria-label", "Betaal-QR");
    qrSection.appendChild(holder);
    app.appendChild(qrSection);
    app.appendChild(el("p", "footer",
      "Open de scanner ín je bankapp (KBC, Belfius, ING, BNP, Argenta…)."));
  }
})();
</script>
</body>
</html>
